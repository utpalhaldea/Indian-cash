{% extends "base.html" %}

{% block title %}Forgot Password · Visual India{% endblock %}

{% block content %}
<h2>Forgot Password?</h2>

<p class="muted">
    Password recovery is not configured yet.
    Please contact the website administrator for help.
</p>

<form method="POST" action="{{ url_for('forgot_password') }}">
    <label for="phone">Phone Number</label>
    <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="Enter your registered phone number"
        inputmode="numeric"
        pattern="[0-9]{10}"
        maxlength="10"
        required
    >

    <button type="submit">Request Password Help</button>
</form>

<p class="center">
    <a class="link" href="{{ url_for('login') }}">← Back to Login</a>
</p>
{% endblock %}
